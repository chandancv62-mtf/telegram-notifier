name: Run Telegram Trading Bot

on:
  schedule:
    # सोमवार से शुक्रवार शाम 3:30 बजे (IST) ऑटोमैटिक चलेगा
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # GitHub वेबसाइट पर "Run workflow" बटन से चलाने के लिए

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Trading Scripts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          python src/weekly_analyzer.py
          python src/trade_tracker.py
          python src/telegram_notifier.py

      - name: Commit and Push Updated Excel & CSV Files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Auto-update trading results and signals [skip ci]" || exit 0
          git push
